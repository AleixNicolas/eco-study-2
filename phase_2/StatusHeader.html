<div class="alert alert-secondary d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 shadow-sm">
    <div class="mb-2 mb-md-0 text-center text-md-start">
        <span class="badge bg-primary me-2" style="font-size: 1.05rem; margin-right: 15px;">Round {{ current_round }} / {{ total_rounds }}</span>
        <strong>Total Completed:</strong> <span class="badge bg-dark" style="font-size: 1rem;">{{ completed_total }}</span>
    </div>
    <div class="d-flex align-items-center justify-content-center" style="gap: 15px;">
        
        {{ if shield_active }}
        <div class="text-center">
            <span style="font-size: 1.5rem;" title="Perfect Attendance: Lottery Eligible">🎟️</span>
            <div style="font-size: 0.75rem;" class="text-success fw-bold">£80 Lottery Eligible</div>
        </div>
        {{ endif }}

        {{ if chest_active }}
        <div class="text-center">
            <span style="font-size: 1.5rem;" title="On track for Completion Bonus">💰</span>
            <div style="font-size: 0.75rem;" class="text-success fw-bold">{{ bonus_amount }} Bonus Eligible</div>
        </div>
        {{ endif }}
        
    </div>
</div>
