<script>
    let startTime = Date.now();
    let feedData = js_vars.incoming_feed;
    let container = document.getElementById('feed-container');
    let feedSize = feedData.length;
    let backlogChecks = [];

    const targetDate = new Date("{{ deadline_timestamp }}");
    const timerInterval = setInterval(function() {
        const now = new Date().getTime();
        const distance = targetDate.getTime() - now;

        if (distance <= 0) {
            clearInterval(timerInterval);
            document.getElementById("visual-timer").innerText = "TIME EXPIRED";
            document.getElementById("deadline-banner").classList.remove("alert-warning");
            document.getElementById("deadline-banner").classList.add("alert-danger");
            
            // The form and submit button are no longer disabled here.
            // Participants can still submit until you manually advance them.
        } else {
            const h = Math.floor(distance / (1000 * 60 * 60)).toString().padStart(2, '0');
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            const s = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
            document.getElementById("visual-timer").innerText = `${h}h ${m}m ${s}s`;
        }
    }, 1000);

    if (feedSize === 0) {
        container.innerHTML = "<div class='alert alert-info'>Your neighbors did not share any new items today.</div>";
    } else {
        feedData.forEach((item, index) => {
            let card = document.createElement('div');
            card.className = "card bg-light news-item";
            
            card.innerHTML = `
                <h6 class="fw-bold">${item.headline}</h6>
                <div id="mobile_body_${index}" class="mobile-article-body p-2 mb-2 text-muted d-md-none small">
                    ${item.additional_text}
                </div>
                
                <div class="d-flex align-items-center justify-content-between mt-1">
                    <div class="compact-decision">
                        <div class="controls">
                            <div class="form-check">
                                <input class="form-check-input share-radio" type="radio" name="decision_${index}" value="${item.id}" id="share_${index}">
                                <label class="form-check-label" for="share_${index}">Share</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input share-radio" type="radio" name="decision_${index}" value="Not Share" id="not_share_${index}">
                                <label class="form-check-label" for="not_share_${index}">Not Share</label>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-sm btn-primary py-0 text-nowrap" style="height: 30px;" onclick="showArticle(${index})">
                        Read More
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function showArticle(index) {
        let item = feedData[index];
        if (window.innerWidth >= 768) {
            document.getElementById('display-headline').innerText = item.headline;
            document.getElementById('display-body').innerText = item.additional_text;
        } else {
            let mobileContent = document.getElementById('mobile_body_' + index);
            if (mobileContent.style.display === 'block') {
                mobileContent.style.display = 'none';
            } else {
                document.querySelectorAll('.mobile-article-body').forEach(el => el.style.display = 'none');
                mobileContent.style.display = 'block';
            }
        }
    }

    setInterval(() => {
        let count = 0;
        for (let i = 0; i < feedSize; i++) {
            if (!document.querySelector(`input[name="decision_${i}"]:checked`)) count++;
        }
        backlogChecks.push(count);
    }, 500);

    function submitFeed() {
        let shares = [];
        let missingDecision = false;

        for (let i = 0; i < feedSize; i++) {
            let selected = document.querySelector(`input[name="decision_${i}"]:checked`);
            if (!selected) {
                missingDecision = true;
            } else if (selected.value !== "Not Share") {
                shares.push(selected.value);
            }
        }

        if (missingDecision) {
            alert("Please select 'Share' or 'Not Share' for every article before completing the round.");
            return;
        }

        document.getElementById('outgoing_shares').value = JSON.stringify(shares);
        document.getElementById('max_feed_size').value = feedSize;
        document.getElementById('average_feed_size').value = feedSize.toFixed(2);
        
        let maxPending = backlogChecks.length > 0 ? Math.max(...backlogChecks) : feedSize;
        let avgPending = backlogChecks.length > 0 ? (backlogChecks.reduce((a,b) => a+b, 0) / backlogChecks.length) : feedSize;
        
        document.getElementById('max_pending_items').value = maxPending;
        document.getElementById('average_pending_items').value = avgPending.toFixed(2);
        document.getElementById('total_time_on_feed').value = (Date.now() - startTime) / 1000;

        document.getElementById('form').submit();
    }
</script>
