{{ block title }}System Connecting{{ endblock }}
{{ block content }}

<div class="card shadow-sm p-5 text-center mt-5">
    <h4 class="mb-4 text-primary">Establishing Secure Connection</h4>
    <p class="text-muted">Please wait while we assign your network node...</p>
    
    <div class="d-flex justify-content-center mt-4 mb-2">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</div>

<style>
    .otree-btn-next { display: none !important; }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('form').submit();
    });
</script>

{{ endblock }}
